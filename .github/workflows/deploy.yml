name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Smokymtnpooperscooper-main/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Build React website
        run: yarn build
        env:
          PUBLIC_URL: https://www.smokymtnpooperscooper.com

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Smokymtnpooperscooper-main/frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
